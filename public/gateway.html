<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Metropolis Gateway | Permanent Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px #10b981); }
      50% { opacity: 0.6; filter: drop-shadow(0 0 5px #10b981); }
    }
    .neon-glow {
      animation: pulse-fast 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-black text-neutral-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none antialiased">
  <div class="max-w-md w-full bg-neutral-900/90 border border-emerald-500/30 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl shadow-emerald-950/50 text-center relative overflow-hidden">
    <!-- Ambient background light -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header badge -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono font-bold uppercase tracking-wider mb-4">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      Permanent Gateway v2.4
    </div>

    <!-- Logo / Title -->
    <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-white mb-2">
      NEON <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">METROPOLIS</span>
    </h1>
    <p class="text-xs sm:text-sm text-neutral-400 mb-6 font-mono">
      Persistent 24/7 High-Availability Neural Network
    </p>

    <!-- Radar / Status Box -->
    <div id="status-card" class="bg-black/60 border border-neutral-800 rounded-2xl p-4 mb-6 text-left">
      <div class="flex items-center justify-between text-xs font-mono mb-2">
        <span class="text-neutral-500">Node Status:</span>
        <span id="node-badge" class="px-2 py-0.5 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
          Probing Mesh...
        </span>
      </div>
      <div class="text-xs font-mono text-neutral-400 truncate">
        <span class="text-neutral-500">Live URL:</span>
        <span id="live-url-display" class="text-emerald-400 ml-1">resolving...</span>
      </div>
      <div id="countdown-wrapper" class="hidden mt-3 pt-2 border-t border-neutral-800 text-[11px] font-mono text-neutral-400 flex items-center justify-between">
        <span>Auto-connecting in:</span>
        <span id="countdown-sec" class="text-emerald-400 font-bold">2s</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="space-y-3">
      <a id="enter-btn" href="#" target="_blank" class="w-full inline-flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-black font-extrabold text-sm tracking-wide shadow-lg shadow-emerald-500/20 transition-all transform active:scale-95 cursor-pointer">
        <span>🚀 ENTER METROPOLIS</span>
      </a>

      <button id="refresh-btn" onclick="checkStatus()" class="w-full py-2.5 px-4 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs font-mono font-medium transition-all cursor-pointer">
        🔄 Re-check Neural Bridge
      </button>

      <a href="https://t.me/NeonMetropolish_bot" target="_blank" class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-neutral-900 border border-cyan-500/30 hover:border-cyan-400 text-cyan-400 text-xs font-mono font-medium transition-all cursor-pointer">
        <span>✈️ Telegram Official Bot</span>
      </a>
    </div>

    <!-- Pre-release & serverless badge -->
    <div class="mt-6 pt-4 border-t border-neutral-800/80 text-[10px] text-neutral-500 font-mono flex items-center justify-between">
      <span>PRE-RELEASE v0.2.0</span>
      <span>CRYPTOGRAPHICALLY SECURED VAULT</span>
    </div>
  </div>

  <script>
    const STATUS_FEED = 'https://raw.githubusercontent.com/pocomon9/green/main/status.json';
    let targetUrl = '';
    let countdownTimer = null;

    async function checkStatus() {
      const badge = document.getElementById('node-badge');
      const urlDisplay = document.getElementById('live-url-display');
      const enterBtn = document.getElementById('enter-btn');
      const countdownWrapper = document.getElementById('countdown-wrapper');
      const countdownSec = document.getElementById('countdown-sec');

      badge.className = 'px-2 py-0.5 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
      badge.textContent = 'Probing Mesh...';
      urlDisplay.textContent = 'Querying status.json...';

      try {
        const res = await fetch(STATUS_FEED + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Status feed unreachable');
        const data = await res.json();

        if (data && data.url && data.url.startsWith('https://')) {
          targetUrl = data.url;
          badge.className = 'px-2 py-0.5 rounded font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          badge.textContent = 'ONLINE [ACTIVE]';
          urlDisplay.textContent = targetUrl;
          enterBtn.href = targetUrl;

          // Start auto redirect
          let remaining = 2;
          countdownWrapper.classList.remove('hidden');
          countdownSec.textContent = remaining + 's';
          if (countdownTimer) clearInterval(countdownTimer);
          countdownTimer = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
              clearInterval(countdownTimer);
              window.location.href = targetUrl;
            } else {
              countdownSec.textContent = remaining + 's';
            }
          }, 1000);
        } else {
          badge.className = 'px-2 py-0.5 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
          badge.textContent = 'RECYCLING (REBIRTH)';
          urlDisplay.textContent = 'Cloudflare tunnel cycling, re-checking in 5s...';
          countdownWrapper.classList.add('hidden');
          setTimeout(checkStatus, 5000);
        }
      } catch (err) {
        console.error(err);
        badge.className = 'px-2 py-0.5 rounded font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
        badge.textContent = 'CONNECTING...';
        urlDisplay.textContent = 'Connecting to gateway fallback...';
        setTimeout(checkStatus, 4000);
      }
    }

    checkStatus();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Metropolis | High-Speed Gateway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040806;
      color: #10b981;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .core {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(16, 185, 129, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #6ee7b7;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="core"></div>
  <h1>NEON METROPOLIS</h1>
  <p id="status-text">Entering high-speed cluster...</p>

  <script>
    const CANDIDATES = [
      "https://meaning-gallery-establishment-volunteer.trycloudflare.com",
      "https://printable-therapy-servers-nerve.trycloudflare.com",
      "https://romantic-moscow-investigators-funeral.trycloudflare.com"
    ];
    const STATUS_REPOS = [
      "https://raw.githubusercontent.com/pocomon9/green/main/status.json",
      "https://raw.githubusercontent.com/sifihub/green/main/status.json"
    ];

    function redirect(url) {
      try { localStorage.setItem('neon_fast_url', url); } catch(e) {}
      const target = url + window.location.search;
      window.location.replace(target);
    }

    async function ping(url) {
      if (!url || !url.startsWith('https://')) return null;
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 1600);
        const res = await fetch(url + '/api/health', { signal: ctrl.signal });
        clearTimeout(tid);
        if (res.ok) return url;
      } catch(e) {}
      return null;
    }

    async function startFastConnect() {
      // 1. Instant check cached node
      try {
        const cached = localStorage.getItem('neon_fast_url');
        if (cached) {
          const fast = await ping(cached);
          if (fast) return redirect(fast);
        }
      } catch(e) {}

      // 2. Parallel race of live candidates
      const racePromises = CANDIDATES.map(u => ping(u));
      const results = await Promise.all(racePromises);
      const alive = results.find(Boolean);
      if (alive) return redirect(alive);

      // 3. Fallback: Query live status feeds if tunnels cycled
      document.getElementById('status-text').textContent = 'Connecting to fallback node...';
      for (const feed of STATUS_REPOS) {
        try {
          const res = await fetch(feed + '?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (data && data.url && data.url.startsWith('https://')) {
              const live = await ping(data.url);
              if (live) return redirect(live);
            }
          }
        } catch(e) {}
      }

      document.getElementById('status-text').textContent = 'Reconnecting in 2s...';
      setTimeout(startFastConnect, 2000);
    }

    startFastConnect();
  </script>
</body>
</html>
